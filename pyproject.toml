[project]
name = "mise"
version = "0.1.0"
description = "The cooking assistant that tells you to wait. An Alexa+ MCP server that watches the pan."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# mcp 2.x: FastMCP became MCPServer. The upper cap is no longer ours - it is
# strands-agents 1.56, which requires mcp<2.2, so this lands on 2.1.x. At the
# 2025-11-25 the track requires, a 2.x server puts identical bytes on the wire;
# what it adds is answering the 2026-07-28 era too. mcp 2.x needs pydantic>=2.12.
dependencies = ["mcp>=2.1,<2.2", "pydantic>=2.12", "uvicorn>=0.30", "starlette>=0.37"]

[project.optional-dependencies]
# The AgentCore layers degrade to local fallbacks when these are absent, which
# is the supported path on a laptop with no credentials - but they must be
# installable, or the three-layer contract is only ever one layer deep.
# botocore>=1.43 is a hard floor, not a preference: 1.42.9 has no `outputConfig`
# in its bedrock-runtime model, so structured output fails client-side.
aws = ["strands-agents", "bedrock-agentcore", "boto3", "botocore>=1.43.0"]
# Opik wraps evals/abstention.py; it never replaces it. `python3 evals/opik_pack.py`
# prints the same harness report when this extra is absent, so the no-credentials
# path is unchanged. >=2.0 is the floor for `experiment_scoring_functions`, which is
# where the corpus-level ratios have to live - see the module docstring.
evals = ["opik>=2.0,<3"]
# Strands emits OpenTelemetry; Opik ingests OTLP over HTTP only (the gRPC exporter
# errors). Needed only to trace the agent graph, not to run the eval.
otel = ["opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http"]
# The hot graph. strands-agents runs offline against a scripted model provider,
# so this is installable and testable with no AWS account at all.
agents = ["strands-agents>=1.56"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mise"]
