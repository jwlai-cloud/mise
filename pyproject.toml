[project]
name = "mise"
version = "0.1.0"
description = "The cooking assistant that tells you to wait. An Alexa+ MCP server that watches the pan."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["mcp>=1.27", "pydantic>=2", "uvicorn>=0.30", "starlette>=0.37"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mise"]
